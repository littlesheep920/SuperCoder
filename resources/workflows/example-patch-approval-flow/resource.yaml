{
  "schema_version": "1",
  "kind": "workflow",
  "slug": "example-patch-approval-flow",
  "name": "Example Patch Approval Flow",
  "version": "1.0.0",
  "description": "Example workflow that reviews a patch, validates it, and pauses for human approval before recording the decision. Sample content for the SuperCoder protocol.",
  "aliases": [],
  "tags": [
    "example",
    "workflow",
    "approval",
    "patch"
  ],
  "categories": [
    "software-development/review"
  ],
  "runtimes": [
    "kiro"
  ],
  "inputs": [
    {
      "name": "request",
      "type": "text",
      "required": true,
      "description": "Caller-supplied input for this example resource."
    }
  ],
  "outputs": [
    {
      "name": "result",
      "type": "text",
      "required": true,
      "description": "Result produced by this example resource."
    }
  ],
  "permissions": [],
  "dependencies": [],
  "entrypoint": "WORKFLOW.md",
  "status": "draft",
  "owner_team": "platform-ai",
  "workflow": {
    "nodes": [
      {
        "id": "start",
        "type": "input"
      },
      {
        "id": "review",
        "type": "resource",
        "resource": {
          "kind": "skill",
          "slug": "example-api-contract-review",
          "version": "^1.0.0"
        }
      },
      {
        "id": "approve",
        "type": "approval"
      },
      {
        "id": "record",
        "type": "output"
      }
    ],
    "edges": [
      {
        "from": "start",
        "to": "review"
      },
      {
        "from": "review",
        "to": "approve"
      },
      {
        "from": "approve",
        "to": "record"
      }
    ],
    "retry_policy": {
      "max_attempts": 2,
      "backoff": "exponential"
    },
    "approval_gates": [
      "approve"
    ]
  }
}
