  "aliases": [],
  "tags": [
    "example",
    "workflow",
    "dependency",
    "upgrade"
  ],
  "categories": [
    "software-development/maintenance"
  ],
  "runtimes": [
    "cursor"
  ],
  "inputs": [
    {
      "name": "request",
      "type": "text",
      "required": true,
      "description": "Caller-supplied input for this example resource."
    }
  ],
  "outputs": [
    {
      "name": "result",
      "type": "text",
      "required": true,
      "description": "Result produced by this example resource."
    }
  ],
  "permissions": [],
  "dependencies": [],
