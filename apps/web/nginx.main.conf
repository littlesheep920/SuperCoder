# Main nginx configuration for the unprivileged web container.
#
# The stock `/etc/nginx/nginx.conf` from the nginx image writes its pid to
# /run/nginx.pid and its temp files under /var/cache/nginx as root. Because this
# image runs as the `nginx` user, every one of those paths is replaced with one
# inside /var/lib/nginx, which the Dockerfile chowns to that user.
#
# Only the paths differ from upstream; buffering, gzip, and proxy behaviour live
# in conf.d/supercoder.conf.

user  nginx;
worker_processes  auto;
pid   /var/lib/nginx/logs/nginx.pid;
error_log  /var/lib/nginx/logs/error.log warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /var/lib/nginx/tmp/client_body;
    proxy_temp_path       /var/lib/nginx/tmp/proxy;
    fastcgi_temp_path     /var/lib/nginx/tmp/fastcgi;
    uwsgi_temp_path       /var/lib/nginx/tmp/uwsgi;
    scgi_temp_path        /var/lib/nginx/tmp/scgi;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  /var/lib/nginx/logs/access.log  main;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;

    include /etc/nginx/conf.d/*.conf;
}
