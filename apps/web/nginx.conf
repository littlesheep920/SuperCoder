# nginx configuration for the SuperCoder web client.
#
# Two responsibilities:
#   1. Serve the Vue SPA with HTML5 history fallback. The router uses
#      createWebHistory(), so a deep link or a refresh on /resources/<id> must
#      return index.html instead of a 404.
#   2. Proxy /v1 to the API service so the browser never needs CORS and never
#      needs to know the API host. This keeps the API base at "/v1".

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Basic hardening. None of these weaken the SPA fallback.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable; cache them aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy REST and SSE calls to the API. `proxy_buffering off` and a long
    # read timeout are required for /jobs/{id}/events/stream (text/event-stream).
    location /v1/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback: every non-file path resolves to the app shell. The client
    # router then renders the matching view (or its not-found state).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
