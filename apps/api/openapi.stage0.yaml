              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Evaluation"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "default": {
            "$ref": "#/components/responses/UnexpectedError"
          }
        }
      }
    },
    "/export-targets": {
      "get": {
        "tags": [
          "Resources"
        ],
        "operationId": "listExportTargets",
        "summary": "List runtime environments a resource can be exported to",
        "description": "The environments this deployment can produce artefacts for, with the directory each one reads skills from. One authoritative source: the console renders the choices from this, rather than carrying its own copy that could drift.",
        "responses": {
          "200": {
            "description": "The available export targets.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ExportTargetList"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "default": {
            "$ref": "#/components/responses/UnexpectedError"
          }
        }
      }
    },
    "/jobs": {
      "get": {
        "tags": [
          "Jobs"
        ],
        "operationId": "listJobs",
        "summary": "List durable background jobs",
        "parameters": [
          {
            "$ref": "#/components/parameters/Cursor"
          },
          {
            "$ref": "#/components/parameters/Limit"
          },
          {
            "name": "status",
            "in": "query",
            "required": false,
            "schema": {
              "$ref": "#/components/schemas/JobStatus"
            }
          },
          {
            "name": "queue_name",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "minLength": 1,
