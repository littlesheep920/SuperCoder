            }
          },
          {
            "name": "workflow_run_id",
            "in": "query",
            "required": false,
            "schema": {
              "$ref": "#/components/schemas/PublicId"
            }
          },
          {
            "name": "resource_version_id",
            "in": "query",
            "required": false,
            "schema": {
              "$ref": "#/components/schemas/PublicId"
            }
          },
          {
            "name": "correlation_id",
            "in": "query",
            "required": false,
            "schema": {
              "$ref": "#/components/schemas/CorrelationId"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "A page of jobs.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/JobList"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "default": {
            "$ref": "#/components/responses/UnexpectedError"
          }
        }
      }
    },
    "/jobs/{jobId}": {
      "get": {
        "tags": [
          "Jobs"
        ],
        "operationId": "getJob",
        "summary": "Get a durable job",
        "parameters": [
          {
            "$ref": "#/components/parameters/JobId"
          }
        ],
        "responses": {
          "200": {
            "description": "Current job state and structured result or failure.",
            "headers": {
              "ETag": {
                "$ref": "#/components/headers/ETag"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Job"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "default": {
            "$ref": "#/components/responses/UnexpectedError"
          }
        }
      }
    },
    "/jobs/{jobId}/cancel": {
      "post": {
        "tags": [
          "Jobs"
        ],
        "operationId": "cancelJob",
        "summary": "Request cancellation of a job",
        "parameters": [
          {
            "$ref": "#/components/parameters/JobId"
          },
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          },
          {
            "$ref": "#/components/parameters/IfMatch"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CancelRequest"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Cancellation request recorded as a Job event.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Job"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "412": {
            "$ref": "#/components/responses/PreconditionFailed"
          },
          "default": {
            "$ref": "#/components/responses/UnexpectedError"
          }
        }
      }
    },
    "/jobs/{jobId}/events": {
      "get": {
        "tags": [
          "Jobs"
        ],
        "operationId": "listJobEvents",
        "summary": "List append-only events for a job",
        "description": "Events are ordered by sequence_no. The cursor encodes the last observed sequence and cannot address another Job.",
        "parameters": [
          {
            "$ref": "#/components/parameters/JobId"
          },
          {
            "$ref": "#/components/parameters/Cursor"
          },
          {
            "$ref": "#/components/parameters/Limit"
          },
          {
            "name": "event_type",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 64
            }
          }
        ],
        "responses": {
          "200": {
            "description": "An ordered page of Job events.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/JobEventList"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "default": {
            "$ref": "#/components/responses/UnexpectedError"
          }
        }
      }
    },
    "/jobs/{jobId}/events/stream": {
      "get": {
        "tags": [
          "Jobs"
        ],
        "operationId": "streamJobEvents",
        "summary": "Stream Job events using Server-Sent Events",
        "description": "Each SSE id is the decimal sequence_no, event is event_type, and data is one JSON-encoded JobEvent. Clients resume with Last-Event-ID. Authorization is rechecked when the stream is established.",
        "parameters": [
          {
            "$ref": "#/components/parameters/JobId"
          },
          {
            "name": "Last-Event-ID",
            "in": "header",
            "required": false,
            "description": "Last fully processed decimal Job event sequence number.",
            "schema": {
              "type": "string",
              "pattern": "^[0-9]+$"
            }
          },
          {
            "name": "heartbeat_seconds",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 5,
              "maximum": 60,
              "default": 15
            }
          }
        ],
        "responses": {
          "200": {
            "description": "SSE stream. Heartbeats are comment frames and are not Job events.",
            "headers": {
              "Cache-Control": {
                "description": "Always no-cache.",
                "schema": {
                  "type": "string",
                  "const": "no-cache"
                }
              }
            },
            "content": {
              "text/event-stream": {
                "schema": {
                  "type": "string"
                },
                "examples": {
                  "statusChange": {
                    "value": "id: 4\nevent: status_changed\ndata: {\"job_id\":\"01J00000000000000000000000\",\"sequence_no\":4,\"event_type\":\"status_changed\",\"actor_type\":\"worker\",\"actor_id\":\"worker-a\",\"payload\":{},\"occurred_at\":\"2026-01-01T00:00:00Z\"}\n\n"
                  }
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "410": {
            "description": "Requested event history is outside the retained stream window; use the event list endpoint to re-establish a cursor.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/UnexpectedError"
          }
        }
      }
    },
    "/jobs/{jobId}/retry": {
      "post": {
        "tags": [
          "Jobs"
        ],
        "operationId": "retryJob",
        "summary": "Requeue a failed job",
        "description": "Requeues a job that ended in a terminal failure. A running job is refused because it would gain a second owner; a succeeded job is refused because there is nothing to redo.",
        "parameters": [
          {
            "$ref": "#/components/parameters/JobId"
          },
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "responses": {
          "202": {
            "description": "The requeued job.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Job"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "default": {
            "$ref": "#/components/responses/UnexpectedError"
          }
        }
      }
    },
    "/registration/commit": {
      "post": {
        "tags": [
          "Resources"
        ],
        "operationId": "commitResourceDraft",
        "summary": "Commit a reviewed draft",
        "description": "Writes the draft after re-validating it, and requires explicit confirmation so a draft cannot be committed by merely previewing it. If validation fails after files are written, the written files are rolled back.",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/DraftCommitRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "The created resource and version.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DraftCommitResponse"
                }
              }
            }
