    "/jobs/{jobId}/events/stream": {
      "get": {
        "tags": ["Jobs"],
        "operationId": "streamJobEvents",
        "summary": "Stream Job events using Server-Sent Events",
        "description": "Each SSE id is the decimal sequence_no, event is event_type, and data is one JSON-encoded JobEvent. Clients resume with Last-Event-ID. Authorization is rechecked when the stream is established.",
        "parameters": [
          { "$ref": "#/components/parameters/JobId" },
          {
            "name": "Last-Event-ID",
            "in": "header",
            "required": false,
            "description": "Last fully processed decimal Job event sequence number.",
            "schema": { "type": "string", "pattern": "^[0-9]+$" }
          },
          {
            "name": "heartbeat_seconds",
            "in": "query",
            "required": false,
            "schema": { "type": "integer", "minimum": 5, "maximum": 60, "default": 15 }
          }
        ],
        "responses": {
          "200": {
            "description": "SSE stream. Heartbeats are comment frames and are not Job events.",
            "headers": {
              "Cache-Control": { "description": "Always no-cache.", "schema": { "type": "string", "const": "no-cache" } }
            },
            "content": {
              "text/event-stream": {
                "schema": { "type": "string" },
                "examples": {
                  "statusChange": {
                    "value": "id: 4\nevent: status_changed\ndata: {\"job_id\":\"01J00000000000000000000000\",\"sequence_no\":4,\"event_type\":\"status_changed\",\"actor_type\":\"worker\",\"actor_id\":\"worker-a\",\"payload\":{},\"occurred_at\":\"2026-01-01T00:00:00Z\"}\n\n"
                  }
                }
              }
            }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "410": {
            "description": "Requested event history is outside the retained stream window; use the event list endpoint to re-establish a cursor.",
            "content": { "application/problem+json": { "schema": { "$ref": "#/components/schemas/Error" } } }
          },
          "default": { "$ref": "#/components/responses/UnexpectedError" }
        }
      }
    },
