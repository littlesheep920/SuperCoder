{
  "openapi": "3.1.0",
  "jsonSchemaDialect": "https://json-schema.org/draft/2020-12/schema",
  "info": {
    "title": "SuperCoder Control Plane API",
    "version": "0.1.0-stage0",
    "summary": "Frozen Stage 0 contract for the SuperCoder synchronous control plane.",
    "description": "This document is a contract, not a claim that an API service is running. Git remains the resource-content source of truth; MySQL stores governance and execution facts; indexes and caches are rebuildable projections. Long-running work is represented by Jobs. Resource content, prompts, model output, and imported evaluation material are untrusted data and cannot alter authorization or platform policy. External LLM access is disabled by default and no endpoint accepts provider secrets."
  },
  "servers": [
    {
      "url": "https://api.supercoder.example/v1",
      "description": "Illustrative production base URL; deployment chooses the actual host."
    }
  ],
  "tags": [
    {
      "name": "Resources",
      "description": "Stable resource identities and immutable versions."
    },
    {
      "name": "Reviews",
      "description": "Append-only governance reviews bound to exact artifact hashes."
    },
    {
      "name": "Search",
      "description": "Permission-filtered discovery over rebuildable indexes."
    },
    {
      "name": "Agent registration",
      "description": "Specialized, asynchronous registration of agent resources."
    },
    {
      "name": "Workflows",
      "description": "Published workflow definitions and immutable execution runs."
    },
    {
      "name": "Jobs",
      "description": "Durable background work and append-only events."
    },
    {
      "name": "Evaluations",
      "description": "Evaluation runs with truthful assessor provenance."
    }
  ],
  "security": [
    {
      "bearerAuth": []
    }
  ],
  "paths": {
    "/agent-registrations": {
      "get": {
        "tags": [
          "Agent registration"
        ],
        "operationId": "listAgentRegistrations",
        "summary": "List agent registration attempts",
        "parameters": [
          {
            "$ref": "#/components/parameters/Cursor"
          },
          {
            "$ref": "#/components/parameters/Limit"
          },
          {
            "name": "status",
            "in": "query",
            "required": false,
            "schema": {
              "$ref": "#/components/schemas/AgentRegistrationStatus"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "A page of registration attempts.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AgentRegistrationList"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "default": {
            "$ref": "#/components/responses/UnexpectedError"
          }
        }
      },
      "post": {
        "tags": [
          "Agent registration"
        ],
        "operationId": "registerAgentResource",
        "summary": "Register and validate an agent resource",
        "description": "Validates an agent manifest, creates or reuses the stable identity, stores a draft version, and creates a Job for runtime/dependency checks. Registration never implies approval or publication.",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/AgentRegistrationRequest"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Registration accepted for durable validation.",
            "headers": {
              "Location": {
                "$ref": "#/components/headers/Location"
              },
              "Idempotent-Replayed": {
                "$ref": "#/components/headers/IdempotentReplayed"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AgentRegistration"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "422": {
            "$ref": "#/components/responses/ValidationFailed"
          },
          "default": {
            "$ref": "#/components/responses/UnexpectedError"
          }
        }
      }
    },
    "/agent-registrations/{registrationId}": {
      "get": {
        "tags": [
          "Agent registration"
        ],
        "operationId": "getAgentRegistration",
        "summary": "Get one agent registration attempt",
        "parameters": [
          {
            "$ref": "#/components/parameters/RegistrationId"
          }
        ],
        "responses": {
          "200": {
            "description": "Registration state and linked durable Job.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AgentRegistration"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "default": {
            "$ref": "#/components/responses/UnexpectedError"
          }
        }
      }
    },
    "/audit": {
      "get": {
        "tags": [
          "Governance"
        ],
        "operationId": "listAuditRecords",
        "summary": "List audit records",
        "description": "Append-only governance history, newest first, filtered server-side. Each record carries `event_hash` and `previous_event_hash` so a caller can verify the chain. Visibility is applied in the query, before counting and paging.",
        "parameters": [
          {
            "name": "actorId",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            },
            "description": "Only records produced by this actor."
          },
          {
            "name": "action",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            },
            "description": "Exact action name, for example `version.transition`."
          },
          {
            "name": "entityType",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "entityPublicId",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "versionPublicId",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "outcome",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "correlationId",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "$ref": "#/components/parameters/Cursor"
          },
          {
            "$ref": "#/components/parameters/Limit"
          }
        ],
        "responses": {
          "200": {
            "description": "A page of audit records.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuditRecordPage"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "422": {
            "$ref": "#/components/responses/ValidationFailed"
          },
          "default": {
            "$ref": "#/components/responses/UnexpectedError"
          }
        }
      }
    },
    "/discovery/recommend": {
      "post": {
        "tags": [
          "Search"
        ],
        "operationId": "recommendCapabilities",
        "summary": "Recommend capabilities for a stated need",
        "description": "Answers \"which capability should I use?\" from the caller-visible corpus, with a reason per candidate and the version and content hash to cite. When nothing fits it refuses explicitly and lists what it examined — the refusal is a first-class outcome, not an empty result. The model never decides authorization; visibility filtering happens before ranking.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/DiscoveryRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Recommendations or an explicit refusal.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DiscoveryResponse"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "422": {
            "$ref": "#/components/responses/ValidationFailed"
          },
          "503": {
            "$ref": "#/components/responses/ProjectionUnavailable"
          },
          "default": {
            "$ref": "#/components/responses/UnexpectedError"
          }
        }
      }
    },
    "/evaluations": {
      "get": {
        "tags": [
          "Evaluations"
        ],
        "operationId": "listEvaluations",
        "summary": "List evaluation runs",
        "parameters": [
          {
            "$ref": "#/components/parameters/Cursor"
          },
          {
            "$ref": "#/components/parameters/Limit"
          },
          {
            "name": "resource_version_id",
            "in": "query",
            "required": false,
            "schema": {
              "$ref": "#/components/schemas/PublicId"
            }
          },
          {
            "name": "evaluation_kind",
            "in": "query",
            "required": false,
            "schema": {
              "$ref": "#/components/schemas/EvaluationKind"
            }
          },
          {
            "name": "status",
            "in": "query",
            "required": false,
            "schema": {
              "$ref": "#/components/schemas/EvaluationStatus"
            }
          },
          {
            "name": "dataset_id",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 160
            }
          }
        ],
        "responses": {
          "200": {
            "description": "A page of evaluation records.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EvaluationList"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "default": {
            "$ref": "#/components/responses/UnexpectedError"
          }
        }
      },
      "post": {
        "tags": [
          "Evaluations"
        ],
        "operationId": "createEvaluation",
        "summary": "Create a reproducible evaluation run",
        "description": "Pins candidate, dataset snapshot, evaluator version, and truthful assessor provenance before creating a durable Job. Model or synthetic judgments must use model or mixed assessor_type and cannot claim human adjudication.",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreateEvaluationRequest"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Evaluation record and durable Job created.",
            "headers": {
              "Location": {
                "$ref": "#/components/headers/Location"
              },
              "Idempotent-Replayed": {
                "$ref": "#/components/headers/IdempotentReplayed"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Evaluation"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "422": {
            "$ref": "#/components/responses/ValidationFailed"
          },
          "default": {
            "$ref": "#/components/responses/UnexpectedError"
          }
        }
      }
    },
    "/evaluations/{evaluationId}": {
      "get": {
        "tags": [
          "Evaluations"
        ],
        "operationId": "getEvaluation",
        "summary": "Get an evaluation run",
        "parameters": [
          {
            "$ref": "#/components/parameters/EvaluationId"
          }
        ],
        "responses": {
          "200": {
            "description": "Pinned evaluation identity, status, metrics, and result reference.",
