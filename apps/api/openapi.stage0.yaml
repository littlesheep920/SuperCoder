  },
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "description": "Short-lived access token. Authorization is evaluated server-side; claims from request content are never trusted as grants."
      }
    },
    "headers": {
      "Location": {
        "description": "Canonical API path of the created or accepted resource.",
        "schema": { "type": "string", "format": "uri-reference" }
      },
      "ETag": {
        "description": "Strong entity tag derived from public ID and row_version.",
        "schema": { "type": "string", "pattern": "^\"[^\"]+\"$" }
      },
      "IdempotentReplayed": {
        "description": "True when the response replays the original result for the same authenticated caller and Idempotency-Key.",
        "schema": { "type": "boolean" }
      },
      "RetryAfter": {
        "description": "Seconds before a retry is advised.",
        "schema": { "type": "integer", "minimum": 1 }
      }
    },
    "parameters": {
      "Cursor": {
        "name": "cursor",
        "in": "query",
        "required": false,
        "description": "Opaque, endpoint- and filter-bound cursor returned by page.next_cursor. Clients must not construct or reuse it with different filters.",
        "schema": { "type": "string", "minLength": 1, "maxLength": 2048 }
      },
      "Limit": {
        "name": "limit",
        "in": "query",
        "required": false,
        "description": "Maximum records to return.",
        "schema": { "type": "integer", "minimum": 1, "maximum": 100, "default": 25 }
      },
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "description": "Caller-generated key scoped to authenticated actor and operation. Reuse with a different canonical request hash returns 409.",
        "schema": { "type": "string", "minLength": 8, "maxLength": 128, "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$" }
      },
      "IfMatch": {
        "name": "If-Match",
        "in": "header",
        "required": true,
        "description": "Strong ETag from the latest read; stale values return 412.",
        "schema": { "type": "string", "pattern": "^\"[^\"]+\"$" }
      },
      "ResourceId": {
        "name": "resourceId",
        "in": "path",
        "required": true,
        "description": "Stable resource public ULID.",
        "schema": { "$ref": "#/components/schemas/PublicId" }
      },
      "VersionId": {
        "name": "versionId",
        "in": "path",
        "required": true,
        "description": "Exact resource-version public ULID.",
        "schema": { "$ref": "#/components/schemas/PublicId" }
      },
      "RegistrationId": {
        "name": "registrationId",
        "in": "path",
        "required": true,
        "schema": { "$ref": "#/components/schemas/PublicId" }
      },
      "WorkflowId": {
        "name": "workflowId",
        "in": "path",
        "required": true,
        "description": "Workflow-definition public ULID, not a mutable slug.",
        "schema": { "$ref": "#/components/schemas/PublicId" }
      },
      "RunId": {
        "name": "runId",
        "in": "path",
        "required": true,
        "schema": { "$ref": "#/components/schemas/PublicId" }
      },
      "JobId": {
        "name": "jobId",
        "in": "path",
        "required": true,
        "schema": { "$ref": "#/components/schemas/PublicId" }
      },
      "EvaluationId": {
        "name": "evaluationId",
        "in": "path",
        "required": true,
        "schema": { "$ref": "#/components/schemas/PublicId" }
      },
      "ResourceKindQuery": {
        "name": "kind",
        "in": "query",
        "required": false,
        "schema": { "$ref": "#/components/schemas/ResourceKind" }
      },
      "OwnerTeamQuery": {
        "name": "owner_team",
        "in": "query",
        "required": false,
        "schema": { "$ref": "#/components/schemas/Slug" }
      },
      "LifecycleStatusQuery": {
        "name": "status",
        "in": "query",
        "required": false,
        "schema": { "$ref": "#/components/schemas/LifecycleStatus" }
      },
      "RuntimeQuery": {
        "name": "runtime",
        "in": "query",
        "required": false,
        "schema": { "$ref": "#/components/schemas/Runtime" }
      },
      "TagQuery": {
        "name": "tag",
        "in": "query",
        "required": false,
        "schema": { "type": "string", "minLength": 1, "maxLength": 100 }
      },
      "CategoryQuery": {
        "name": "category",
        "in": "query",
        "required": false,
        "schema": { "type": "string", "minLength": 2, "maxLength": 160 }
      }
    },
    "responses": {
      "BadRequest": {
        "description": "Malformed syntax, invalid cursor, or unsupported parameter combination.",
        "content": { "application/problem+json": { "schema": { "$ref": "#/components/schemas/Error" } } }
      },
      "Unauthorized": {
        "description": "Authentication is missing or invalid.",
        "headers": { "WWW-Authenticate": { "schema": { "type": "string" } } },
        "content": { "application/problem+json": { "schema": { "$ref": "#/components/schemas/Error" } } }
      },
      "Forbidden": {
        "description": "Authenticated actor lacks permission; resource existence may be concealed.",
        "content": { "application/problem+json": { "schema": { "$ref": "#/components/schemas/Error" } } }
      },
      "NotFound": {
        "description": "The addressed entity does not exist or is not visible to the actor.",
        "content": { "application/problem+json": { "schema": { "$ref": "#/components/schemas/Error" } } }
      },
      "Conflict": {
        "description": "Identity, idempotency, lifecycle, gate, or terminal-state conflict.",
        "content": { "application/problem+json": { "schema": { "$ref": "#/components/schemas/Error" } } }
      },
      "PreconditionFailed": {
        "description": "If-Match or row_version does not match current state.",
        "content": { "application/problem+json": { "schema": { "$ref": "#/components/schemas/Error" } } }
      },
      "ValidationFailed": {
        "description": "Structurally valid request violates schema, governance, dependency, permission, runtime, or provenance rules.",
        "content": { "application/problem+json": { "schema": { "$ref": "#/components/schemas/Error" } } }
      },
      "RateLimited": {
        "description": "Caller rate limit exceeded.",
        "headers": { "Retry-After": { "$ref": "#/components/headers/RetryAfter" } },
        "content": { "application/problem+json": { "schema": { "$ref": "#/components/schemas/Error" } } }
      },
      "ProjectionUnavailable": {
        "description": "Search projection is unavailable or stale; relational facts remain unchanged.",
        "headers": { "Retry-After": { "$ref": "#/components/headers/RetryAfter" } },
        "content": { "application/problem+json": { "schema": { "$ref": "#/components/schemas/Error" } } }
      },
      "UnexpectedError": {
        "description": "Unexpected server failure with a stable request identifier and no secret-bearing diagnostics.",
        "content": { "application/problem+json": { "schema": { "$ref": "#/components/schemas/Error" } } }
      }
    },
    "schemas": {
      "PublicId": {
        "type": "string",
        "description": "Uppercase Crockford Base32 ULID exposed by the API.",
        "pattern": "^[0-9A-HJKMNP-TV-Z]{26}$"
      },
      "Slug": {
        "type": "string",
        "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
        "minLength": 2,
        "maxLength": 160
      },
      "SemanticVersion": {
        "type": "string",
        "pattern": "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$"
      },
      "Hash": {
        "type": "string",
        "pattern": "^sha256:[0-9a-f]{64}$"
      },
      "Timestamp": {
        "type": "string",
        "format": "date-time",
        "description": "RFC 3339 timestamp normalized to UTC by the server."
      },
      "CorrelationId": {
        "type": "string",
        "minLength": 1,
        "maxLength": 128,
        "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
      },
      "JsonObject": {
        "type": "object",
        "additionalProperties": true
      },
      "ResourceKind": {
        "type": "string",
        "enum": ["skill", "mcp", "prompt", "agent", "workflow", "tool"]
      },
      "Runtime": {
        "type": "string",
        "enum": ["kiro", "claude-code", "cursor", "dify", "openai-compatible-agent-runtime"]
      },
      "LifecycleStatus": {
        "type": "string",
        "enum": ["draft", "validating", "pending_review", "approved", "published", "deprecated", "retired"]
      },
      "PageInfo": {
        "type": "object",
        "additionalProperties": false,
        "required": ["limit", "has_more"],
        "properties": {
          "limit": { "type": "integer", "minimum": 1, "maximum": 100 },
          "has_more": { "type": "boolean" },
          "next_cursor": { "type": ["string", "null"], "maxLength": 2048 }
        }
      },
      "InterfaceField": {
        "type": "object",
        "additionalProperties": false,
        "required": ["name", "type", "required"],
        "properties": {
          "name": { "type": "string", "pattern": "^[A-Za-z_][A-Za-z0-9_]*$", "maxLength": 100 },
          "type": { "type": "string", "pattern": "^[a-z][a-z0-9_-]*$", "maxLength": 100 },
          "required": { "type": "boolean" },
          "description": { "type": "string", "minLength": 1, "maxLength": 500 },
          "schema": { "$ref": "#/components/schemas/JsonObject" }
        }
      },
      "PermissionDeclaration": {
        "oneOf": [
          { "type": "string", "pattern": "^[a-z][a-z0-9_.-]*:[a-z][a-z0-9_.-]*$", "maxLength": 200 },
          {
            "type": "object",
            "additionalProperties": false,
            "required": ["name"],
            "properties": {
              "name": { "type": "string", "pattern": "^[a-z][a-z0-9_.-]*:[a-z][a-z0-9_.-]*$", "maxLength": 200 },
              "scope": { "type": "string", "enum": ["resource", "project", "team", "organization", "external"] },
              "effect": { "type": "string", "enum": ["allow", "deny"] },
              "approval_required": { "type": "boolean" },
              "reason": { "type": "string", "minLength": 1, "maxLength": 500 }
            }
          }
        ]
      },
      "DependencyDeclarationFields": {
        "type": "object",
        "required": ["kind", "slug", "version", "optional", "source"],
        "properties": {
          "kind": { "type": "string", "enum": ["skill", "mcp", "prompt", "agent", "workflow", "tool", "external"] },
          "slug": { "$ref": "#/components/schemas/Slug" },
          "version": { "type": "string", "minLength": 1, "maxLength": 255 },
          "optional": { "type": "boolean" },
          "source": { "type": "string", "enum": ["managed", "external"] },
          "purpose": { "type": "string", "minLength": 1, "maxLength": 500 }
        }
      },
      "DependencyDeclaration": {
        "allOf": [
          { "$ref": "#/components/schemas/DependencyDeclarationFields" }
        ],
        "unevaluatedProperties": false
      },
      "ArtifactReference": {
        "type": "object",
        "additionalProperties": false,
        "required": ["path", "digest", "size_bytes"],
        "properties": {
          "path": {
            "type": "string",
            "description": "Secret-free path relative to the version root; no absolute path or parent traversal.",
            "minLength": 1,
            "maxLength": 500,
            "pattern": "^(?![A-Za-z]:)(?![/\\\\])(?!.*(?:^|[/\\\\])\\.\\.(?:[/\\\\]|$)).+"
          },
          "digest": { "$ref": "#/components/schemas/Hash" },
          "size_bytes": { "type": "integer", "minimum": 0, "maximum": 104857600 },
          "media_type": { "type": "string", "minLength": 1, "maxLength": 200 }
        }
      },
      "ResourceManifest": {
        "type": "object",
        "description": "API projection of resource.yaml. Exact kind-specific validation remains governed by schemas/resource.schema.json; exactly one key matching kind must be present.",
        "additionalProperties": false,
        "required": ["schema_version", "kind", "slug", "name", "version", "description", "aliases", "tags", "categories", "runtimes", "inputs", "outputs", "permissions", "dependencies", "entrypoint", "status", "owner_team"],
        "properties": {
          "schema_version": { "type": "string", "const": "1" },
          "kind": { "$ref": "#/components/schemas/ResourceKind" },
          "slug": { "$ref": "#/components/schemas/Slug" },
          "name": { "type": "string", "minLength": 1, "maxLength": 200 },
          "version": { "$ref": "#/components/schemas/SemanticVersion" },
          "description": { "type": "string", "minLength": 1, "maxLength": 4000 },
