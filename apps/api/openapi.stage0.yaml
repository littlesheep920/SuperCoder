        "method": "GET",
        "path": "/auth/me",
        "operationId": "getCallerIdentity",
        "purpose": "The caller's own subject, teams, and capability set. The frontend uses it to gate rendering; the server re-checks every action, so this response is never an authorization decision.",
        "governedBy": "docs/SECURITY_AND_CONFIGURATION.md §identity"
      }
    ]
  }
