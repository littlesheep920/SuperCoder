    "description": "Implemented endpoints that this contract deliberately does not govern. They serve the deployment and the caller's own identity, not resource governance, and their semantics belong to the deployment documentation (SECURITY_AND_CONFIGURATION.md for identity, the deployment section of the PRD for probes). Listing them here is the whole point: an endpoint that is absent from `paths` must not be confused with an endpoint that is missing.",
    "endpoints": [
      {
        "method": "GET",
        "path": "/health",
        "operationId": "getHealth",
        "purpose": "Liveness and component status. Reports whether MySQL, Git, and the external services are enabled and reachable. Never mutates state.",
        "governedBy": "docs/PRD.md §10.3 and the container health check"
      },
      {
        "method": "GET",
        "path": "/ready",
        "operationId": "getReadiness",
        "purpose": "Readiness. Returns 503 when MySQL is configured but unreachable, so a load balancer removes the instance instead of routing traffic into it.",
        "governedBy": "docs/PRD.md §10.3 and the compose health gate"
      },
