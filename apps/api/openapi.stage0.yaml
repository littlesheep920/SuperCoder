{
  "openapi": "3.1.0",
  "jsonSchemaDialect": "https://json-schema.org/draft/2020-12/schema",
  "info": {
    "title": "SuperCoder Control Plane API",
    "version": "0.1.0-stage0",
    "summary": "Frozen Stage 0 contract for the SuperCoder synchronous control plane.",
    "description": "This document is a contract, not a claim that an API service is running. Git remains the resource-content source of truth; MySQL stores governance and execution facts; indexes and caches are rebuildable projections. Long-running work is represented by Jobs. Resource content, prompts, model output, and imported evaluation material are untrusted data and cannot alter authorization or platform policy. External LLM access is disabled by default and no endpoint accepts provider secrets."
  },
  "servers": [
    {
      "url": "https://api.supercoder.example/v1",
      "description": "Illustrative production base URL; deployment chooses the actual host."
    }
  ],
  "tags": [
    { "name": "Resources", "description": "Stable resource identities and immutable versions." },
    { "name": "Reviews", "description": "Append-only governance reviews bound to exact artifact hashes." },
    { "name": "Search", "description": "Permission-filtered discovery over rebuildable indexes." },
    { "name": "Agent registration", "description": "Specialized, asynchronous registration of agent resources." },
    { "name": "Workflows", "description": "Published workflow definitions and immutable execution runs." },
    { "name": "Jobs", "description": "Durable background work and append-only events." },
    { "name": "Evaluations", "description": "Evaluation runs with truthful assessor provenance." }
  ],
  "security": [
    { "bearerAuth": [] }
  ],
  "paths": {
    "/resources": {
      "get": {
        "tags": ["Resources"],
        "operationId": "listResources",
        "summary": "List resource identities",
        "description": "Returns permission-filtered resource identities with an optional selected version. Cursor ordering is stable by created_at and public ID.",
        "parameters": [
          { "$ref": "#/components/parameters/Cursor" },
          { "$ref": "#/components/parameters/Limit" },
          { "$ref": "#/components/parameters/ResourceKindQuery" },
          { "$ref": "#/components/parameters/OwnerTeamQuery" },
          { "$ref": "#/components/parameters/LifecycleStatusQuery" },
          { "$ref": "#/components/parameters/RuntimeQuery" },
          { "$ref": "#/components/parameters/TagQuery" },
          { "$ref": "#/components/parameters/CategoryQuery" }
        ],
        "responses": {
          "200": {
            "description": "A page of resource identities.",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ResourceList" } } }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "429": { "$ref": "#/components/responses/RateLimited" },
          "default": { "$ref": "#/components/responses/UnexpectedError" }
        }
      },
      "post": {
        "tags": ["Resources"],
        "operationId": "createResource",
        "summary": "Create a resource identity and first draft version",
        "description": "Atomically validates the manifest, creates the stable (kind, slug) identity, and stores the first draft version. It does not publish, execute, index, or approve the resource.",
        "parameters": [
          { "$ref": "#/components/parameters/IdempotencyKey" }
        ],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CreateResourceRequest" } } }
        },
        "responses": {
          "201": {
            "description": "Resource identity and first draft version created.",
            "headers": {
              "Location": { "$ref": "#/components/headers/Location" },
              "ETag": { "$ref": "#/components/headers/ETag" },
              "Idempotent-Replayed": { "$ref": "#/components/headers/IdempotentReplayed" }
            },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ResourceDetail" } } }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "422": { "$ref": "#/components/responses/ValidationFailed" },
          "429": { "$ref": "#/components/responses/RateLimited" },
          "default": { "$ref": "#/components/responses/UnexpectedError" }
        }
      }
    },
    "/resources/{resourceId}": {
      "get": {
        "tags": ["Resources"],
        "operationId": "getResource",
        "summary": "Get a stable resource identity",
        "parameters": [
          { "$ref": "#/components/parameters/ResourceId" },
          {
            "name": "include_versions",
            "in": "query",
            "required": false,
            "description": "Include a bounded newest-first version summary list.",
            "schema": { "type": "boolean", "default": false }
          }
        ],
        "responses": {
          "200": {
            "description": "Resource identity and selected version details.",
            "headers": { "ETag": { "$ref": "#/components/headers/ETag" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ResourceDetail" } } }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "default": { "$ref": "#/components/responses/UnexpectedError" }
        }
      }
    },
    "/resources/{resourceId}/versions": {
      "get": {
        "tags": ["Resources"],
        "operationId": "listResourceVersions",
        "summary": "List versions for one resource identity",
        "parameters": [
          { "$ref": "#/components/parameters/ResourceId" },
          { "$ref": "#/components/parameters/Cursor" },
          { "$ref": "#/components/parameters/Limit" },
          { "$ref": "#/components/parameters/LifecycleStatusQuery" }
        ],
        "responses": {
          "200": {
            "description": "A page of immutable version records.",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ResourceVersionList" } } }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "default": { "$ref": "#/components/responses/UnexpectedError" }
        }
      },
      "post": {
        "tags": ["Resources"],
        "operationId": "createResourceVersion",
        "summary": "Create a new draft version",
        "description": "Creates a new SemVer under an existing stable identity. Published version numbers are never reused.",
        "parameters": [
          { "$ref": "#/components/parameters/ResourceId" },
          { "$ref": "#/components/parameters/IdempotencyKey" }
        ],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CreateResourceVersionRequest" } } }
        },
        "responses": {
          "201": {
            "description": "Draft version created.",
            "headers": {
              "Location": { "$ref": "#/components/headers/Location" },
              "ETag": { "$ref": "#/components/headers/ETag" },
              "Idempotent-Replayed": { "$ref": "#/components/headers/IdempotentReplayed" }
            },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ResourceVersion" } } }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "422": { "$ref": "#/components/responses/ValidationFailed" },
          "default": { "$ref": "#/components/responses/UnexpectedError" }
        }
      }
    },
    "/resource-versions/{versionId}": {
      "get": {
        "tags": ["Resources"],
        "operationId": "getResourceVersion",
        "summary": "Get an exact resource version",
        "parameters": [
          { "$ref": "#/components/parameters/VersionId" }
        ],
        "responses": {
          "200": {
            "description": "Exact resource version, projections, and immutable hashes.",
            "headers": { "ETag": { "$ref": "#/components/headers/ETag" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ResourceVersion" } } }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "default": { "$ref": "#/components/responses/UnexpectedError" }
        }
      },
      "patch": {
        "tags": ["Resources"],
        "operationId": "updateDraftResourceVersion",
        "summary": "Update draft version content",
        "description": "Only draft versions may change content. The request must carry both If-Match and row_version; later lifecycle states reject the operation.",
        "parameters": [
          { "$ref": "#/components/parameters/VersionId" },
          { "$ref": "#/components/parameters/IfMatch" }
        ],
        "requestBody": {
          "required": true,
          "content": { "application/merge-patch+json": { "schema": { "$ref": "#/components/schemas/UpdateDraftVersionRequest" } } }
        },
        "responses": {
          "200": {
            "description": "Draft version updated and hashes recomputed.",
            "headers": { "ETag": { "$ref": "#/components/headers/ETag" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ResourceVersion" } } }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "412": { "$ref": "#/components/responses/PreconditionFailed" },
          "422": { "$ref": "#/components/responses/ValidationFailed" },
          "default": { "$ref": "#/components/responses/UnexpectedError" }
        }
      }
    },
    "/resource-versions/{versionId}/transitions": {
      "post": {
        "tags": ["Resources"],
        "operationId": "transitionResourceVersionLifecycle",
        "summary": "Request an allowed lifecycle transition",
        "description": "Performs a policy-checked, audited state transition. Transitions that require validation or indexing may return an associated Job. The endpoint never lets a model self-approve or bypass required reviews.",
        "parameters": [
          { "$ref": "#/components/parameters/VersionId" },
          { "$ref": "#/components/parameters/IdempotencyKey" },
          { "$ref": "#/components/parameters/IfMatch" }
        ],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/LifecycleTransitionRequest" } } }
        },
        "responses": {
          "200": {
            "description": "Transition completed synchronously.",
            "headers": { "ETag": { "$ref": "#/components/headers/ETag" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/LifecycleTransitionResult" } } }
          },
          "202": {
            "description": "Transition accepted and a durable Job was created.",
            "headers": { "Location": { "$ref": "#/components/headers/Location" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/LifecycleTransitionResult" } } }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "412": { "$ref": "#/components/responses/PreconditionFailed" },
          "422": { "$ref": "#/components/responses/ValidationFailed" },
          "default": { "$ref": "#/components/responses/UnexpectedError" }
        }
      }
    },
    "/resource-versions/{versionId}/reviews": {
      "get": {
        "tags": ["Reviews"],
        "operationId": "listResourceVersionReviews",
        "summary": "List reviews bound to a resource version",
        "parameters": [
          { "$ref": "#/components/parameters/VersionId" },
          { "$ref": "#/components/parameters/Cursor" },
          { "$ref": "#/components/parameters/Limit" },
          {
            "name": "include_invalidated",
            "in": "query",
            "required": false,
            "schema": { "type": "boolean", "default": false }
          }
        ],
        "responses": {
          "200": {
            "description": "A page of append-only review decisions.",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ResourceReviewList" } } }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "default": { "$ref": "#/components/responses/UnexpectedError" }
        }
      },
      "post": {
        "tags": ["Reviews"],
        "operationId": "createResourceVersionReview",
        "summary": "Append a review decision",
        "description": "Appends a human governance decision against exact artifact and manifest hashes. Conditional approval must be recorded as request_changes.",
        "parameters": [
          { "$ref": "#/components/parameters/VersionId" },
          { "$ref": "#/components/parameters/IdempotencyKey" }
        ],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CreateResourceReviewRequest" } } }
        },
        "responses": {
          "201": {
            "description": "Review decision appended.",
            "headers": { "Location": { "$ref": "#/components/headers/Location" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ResourceReview" } } }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "422": { "$ref": "#/components/responses/ValidationFailed" },
          "default": { "$ref": "#/components/responses/UnexpectedError" }
        }
      }
    },
    "/search/resources": {
      "post": {
        "tags": ["Search"],
        "operationId": "searchResources",
        "summary": "Search discoverable resource versions",
        "description": "Searches permission-filtered, lifecycle-eligible versions. Scores and snippets are non-authoritative projections; each hit identifies an exact relational resource version and source artifact hash.",
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ResourceSearchRequest" } } }
        },
        "responses": {
          "200": {
            "description": "Ranked resource hits and cursor metadata.",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ResourceSearchResponse" } } }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "422": { "$ref": "#/components/responses/ValidationFailed" },
          "429": { "$ref": "#/components/responses/RateLimited" },
          "503": { "$ref": "#/components/responses/ProjectionUnavailable" },
          "default": { "$ref": "#/components/responses/UnexpectedError" }
        }
      }
    },
    "/agent-registrations": {
      "get": {
        "tags": ["Agent registration"],
        "operationId": "listAgentRegistrations",
        "summary": "List agent registration attempts",
        "parameters": [
          { "$ref": "#/components/parameters/Cursor" },
          { "$ref": "#/components/parameters/Limit" },
          {
            "name": "status",
            "in": "query",
            "required": false,
            "schema": { "$ref": "#/components/schemas/AgentRegistrationStatus" }
          }
        ],
        "responses": {
          "200": {
            "description": "A page of registration attempts.",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AgentRegistrationList" } } }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "default": { "$ref": "#/components/responses/UnexpectedError" }
        }
      },
      "post": {
        "tags": ["Agent registration"],
        "operationId": "registerAgentResource",
        "summary": "Register and validate an agent resource",
        "description": "Validates an agent manifest, creates or reuses the stable identity, stores a draft version, and creates a Job for runtime/dependency checks. Registration never implies approval or publication.",
        "parameters": [
          { "$ref": "#/components/parameters/IdempotencyKey" }
        ],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AgentRegistrationRequest" } } }
        },
        "responses": {
          "202": {
            "description": "Registration accepted for durable validation.",
            "headers": {
              "Location": { "$ref": "#/components/headers/Location" },
              "Idempotent-Replayed": { "$ref": "#/components/headers/IdempotentReplayed" }
            },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AgentRegistration" } } }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "422": { "$ref": "#/components/responses/ValidationFailed" },
          "default": { "$ref": "#/components/responses/UnexpectedError" }
        }
      }
    },
    "/agent-registrations/{registrationId}": {
      "get": {
        "tags": ["Agent registration"],
        "operationId": "getAgentRegistration",
        "summary": "Get one agent registration attempt",
        "parameters": [
          { "$ref": "#/components/parameters/RegistrationId" }
        ],
        "responses": {
          "200": {
            "description": "Registration state and linked durable Job.",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AgentRegistration" } } }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "default": { "$ref": "#/components/responses/UnexpectedError" }
        }
      }
    },
    "/workflows": {
      "get": {
        "tags": ["Workflows"],
        "operationId": "listWorkflows",
        "summary": "List executable workflow definitions",
        "description": "Returns lifecycle-eligible workflow definitions whose graph hashes and exact resource versions are known.",
        "parameters": [
          { "$ref": "#/components/parameters/Cursor" },
          { "$ref": "#/components/parameters/Limit" },
          { "$ref": "#/components/parameters/RuntimeQuery" },
          { "$ref": "#/components/parameters/LifecycleStatusQuery" }
        ],
        "responses": {
          "200": {
            "description": "A page of workflow definitions.",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/WorkflowDefinitionList" } } }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "default": { "$ref": "#/components/responses/UnexpectedError" }
        }
      }
    },
    "/workflows/{workflowId}": {
      "get": {
        "tags": ["Workflows"],
        "operationId": "getWorkflowDefinition",
        "summary": "Get an exact executable workflow definition",
        "parameters": [
          { "$ref": "#/components/parameters/WorkflowId" }
        ],
        "responses": {
          "200": {
            "description": "Compiled workflow definition and input/output contracts.",
            "headers": { "ETag": { "$ref": "#/components/headers/ETag" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/WorkflowDefinition" } } }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "default": { "$ref": "#/components/responses/UnexpectedError" }
        }
      }
    },
    "/workflows/{workflowId}/runs": {
      "post": {
        "tags": ["Workflows"],
        "operationId": "createWorkflowRun",
        "summary": "Create an immutable workflow run",
        "description": "Validates input, resolves the full reachable resource and dependency graph to exact versions, persists an immutable resolution snapshot in the same transaction, and creates the root Job. Missing or floating dependencies fail closed before a queued run exists.",
        "parameters": [
          { "$ref": "#/components/parameters/WorkflowId" },
          { "$ref": "#/components/parameters/IdempotencyKey" }
        ],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CreateWorkflowRunRequest" } } }
        },
        "responses": {
          "202": {
            "description": "Run and root Job durably created.",
            "headers": {
              "Location": { "$ref": "#/components/headers/Location" },
              "Idempotent-Replayed": { "$ref": "#/components/headers/IdempotentReplayed" }
            },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/WorkflowRun" } } }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "422": { "$ref": "#/components/responses/ValidationFailed" },
          "default": { "$ref": "#/components/responses/UnexpectedError" }
        }
      }
    },
    "/workflow-runs": {
      "get": {
        "tags": ["Workflows"],
        "operationId": "listWorkflowRuns",
        "summary": "List workflow runs",
        "parameters": [
          { "$ref": "#/components/parameters/Cursor" },
          { "$ref": "#/components/parameters/Limit" },
          {
            "name": "workflow_id",
            "in": "query",
            "required": false,
            "schema": { "$ref": "#/components/schemas/PublicId" }
          },
          {
            "name": "status",
            "in": "query",
            "required": false,
            "schema": { "$ref": "#/components/schemas/WorkflowRunStatus" }
          },
          {
            "name": "correlation_id",
            "in": "query",
            "required": false,
            "schema": { "$ref": "#/components/schemas/CorrelationId" }
          }
        ],
        "responses": {
          "200": {
            "description": "A page of workflow runs.",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/WorkflowRunList" } } }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "default": { "$ref": "#/components/responses/UnexpectedError" }
        }
      }
    },
    "/workflow-runs/{runId}": {
      "get": {
        "tags": ["Workflows"],
        "operationId": "getWorkflowRun",
        "summary": "Get an immutable workflow run record",
        "description": "Returns the definition hash and complete resolution snapshot captured at creation; current registry state never rewrites this history.",
        "parameters": [
          { "$ref": "#/components/parameters/RunId" }
        ],
        "responses": {
          "200": {
            "description": "Workflow run, output or error, and immutable resolution snapshot.",
            "headers": { "ETag": { "$ref": "#/components/headers/ETag" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/WorkflowRun" } } }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "default": { "$ref": "#/components/responses/UnexpectedError" }
        }
      }
    },
    "/workflow-runs/{runId}/approvals": {
      "post": {
        "tags": ["Workflows"],
        "operationId": "decideWorkflowRunApproval",
        "summary": "Approve or reject the active human gate",
        "description": "A decision is bound to one run, one gate, the current row version, and a non-empty reason. It cannot be reused across runs.",
        "parameters": [
          { "$ref": "#/components/parameters/RunId" },
          { "$ref": "#/components/parameters/IdempotencyKey" },
          { "$ref": "#/components/parameters/IfMatch" }
        ],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/WorkflowApprovalRequest" } } }
        },
        "responses": {
          "200": {
            "description": "Gate decision recorded and run state advanced or terminated.",
            "headers": { "ETag": { "$ref": "#/components/headers/ETag" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/WorkflowRun" } } }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "412": { "$ref": "#/components/responses/PreconditionFailed" },
          "422": { "$ref": "#/components/responses/ValidationFailed" },
          "default": { "$ref": "#/components/responses/UnexpectedError" }
        }
      }
    },
