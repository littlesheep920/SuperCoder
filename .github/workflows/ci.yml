# SuperCoder continuous integration.
#
# Every gate here is a command that also runs locally, so a green CI run and a
# green local run mean the same thing. Infrastructure-dependent gates (Docker
# Compose, live MySQL) are intentionally NOT faked here: they run in the
# dedicated `compose` job, and that job reports honestly when the runner cannot
# provide a Docker daemon.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python validators and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Stage 0 static contract validation
        run: python scripts/validate_stage0.py --root .

      - name: Stage 1 validator (imports, tests, manifest)
        run: python scripts/validate_stage1.py

      - name: Unit and API tests (explicit, for readable output)
        run: python -m unittest discover -s tests -p "test_stage*.py" -v

      - name: Seed script is executable and fails cleanly without MySQL
        run: |
          # GitHub Actions runs bash with `set -e`, so the exit status must be
          # captured in the same statement; a bare `python ... ; test $? -eq 2`
          # aborts before the test can evaluate. `set +e` makes the intent
          # explicit: a non-zero status here is expected and is the assertion.
          set +e
          python scripts/seed_demo_resources.py
          status=$?
          set -e
          echo "exit status: $status (expected 2 = MySQL not enabled)"
          test "$status" -eq 2

  web:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # npm ci, never npm install: the lockfile is the contract.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  compose:
    name: Compose stack (honest gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose file is valid
        run: docker compose config --quiet

      - name: Bring the stack up from scratch
        run: docker compose up --build --wait --wait-timeout 300

      - name: API health reports every expected table
        run: |
          curl --fail --silent http://localhost:8000/v1/health | tee health.json
          python - <<'PY'
          import json, sys
          report = json.load(open("health.json"))
          mysql = report["components"]["mysql"]
          if mysql["missing_tables"]:
              sys.exit(f"missing tables: {mysql['missing_tables']}")
          print("mysql ok:", mysql["version"])
          PY

      - name: Six demo resources are seeded
        run: |
          # dev_tokens.json is git-ignored, so a CI checkout only has the
          # template. DevTokenAuth falls back to it at runtime; the test below
          # must read the token from whichever file exists.
          TOKENS=scripts/dev_tokens.json
          [ -f "$TOKENS" ] || TOKENS=scripts/dev_tokens.example.json
          TOKEN=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['tokens'][0]['token'])" "$TOKENS")
          curl --fail --silent -H "Authorization: Bearer $TOKEN" \
            http://localhost:8000/v1/resources | tee resources.json
          python - <<'PY'
          import json, pathlib, sys
          payload = json.load(open("resources.json"))
          count = len(payload["items"])
          # Compare against the repository rather than a fixed number, so the
          # assertion keeps meaning as the corpus grows.
          manifests = list(pathlib.Path("resources").glob("*/*/resource.yaml"))
          expected = len(manifests)
          if count < expected:
              sys.exit(f"seeded {count} resources but the repository declares {expected}")
          print(f"seeded resources: {count} (repository declares {expected})")
          PY

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
